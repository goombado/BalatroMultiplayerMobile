[package]
name = "bmp-steam-bridge"
description = "Steam login and auth session tickets for Balatro Multiplayer on iOS/Android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bmp_steam"
crate-type = ["cdylib", "rlib"]

[dependencies]
steam-vent = "0.5.0"
steam-vent-proto-steam = "=0.5.2"
steam-vent-proto-common = "=0.5.1"
tokio = { version = "1.47", features = ["rt", "time", "sync", "macros", "net", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23.31", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1.0.2"
futures-util = { version = "0.3.31", features = ["sink"] }
bytes = "1.10"
rsa = "0.9.10"
base64 = "0.22.1"
crc32fast = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9"
libc = "0.2"
ctor = "0.2"
tokio-rustls = { version = "0.26", default-features = false }
tokio-stream = "0.1"

[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "3"
