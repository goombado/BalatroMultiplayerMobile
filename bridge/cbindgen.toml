language = "C"
include_guard = "BMP_STEAM_BRIDGE_H"
autogen_warning = "/* Generated by cbindgen from bridge/src/ffi.rs. Do not edit; run scripts/gen-header.sh. */"
header = """
/*
 * bmp-steam-bridge C ABI, version 1 (bmp_bridge_version()).
 *
 * All functions are thread-safe and return without waiting on the network.
 * Returned strings are UTF-8, NUL-terminated and owned by the bridge; each stays
 * valid until the next call to the same function on the same thread.
 *
 * bmp_bridge_state() values:
 *   0 UNINITIALISED  1 LOGGED_OUT  2 AWAITING_QR  3 AWAITING_GUARD_CODE
 *   4 AUTHENTICATING 5 CONNECTING  6 READY        7 NOT_OWNED  8 ERROR
 * READY = logged in, owns Balatro, and an activated auth session ticket is ready.
 */
"""
sys_includes = ["stdint.h"]
no_includes = true
usize_is_size_t = true

[export]
exclude = ["SESSION_HEADER_LEN"]

[export.rename]
"ABI_VERSION" = "BMP_BRIDGE_ABI_VERSION"
"BALATRO_APP_ID" = "BMP_BALATRO_APP_ID"

[parse]
parse_deps = false
